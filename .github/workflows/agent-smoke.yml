name: Agent deployment smoke
on:
  workflow_dispatch:
  push:
    paths:
      - app/agent.py
      - dev/agent_smoke.py
      - .github/workflows/agent-smoke.yml
permissions:
  contents: read
jobs:
  deploy:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deploy real engine and verify authenticated bridge
        run: python dev/agent_smoke.py
