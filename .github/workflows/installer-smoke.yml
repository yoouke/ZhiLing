name: 织灵成品启动检查
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Windows 安装包构建运行编号
        required: true
        default: '41757730434'
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ZhiLing-Windows-x64-candidate
          path: candidate
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Extract and launch the actual packaged application
        run: python -u -X utf8 dev/installer_smoke.py candidate --out smoke-output
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ZhiLing-installer-startup-proof
          path: smoke-output/*
          if-no-files-found: error
          retention-days: 7
