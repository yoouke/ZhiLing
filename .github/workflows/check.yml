name: Windows regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare Windows packaging checks
        run: python -m pip install -r build/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Check Python and JavaScript
        run: |
          python -m compileall -q app build
          node --check app/web/app.js
      - name: Run Windows tests
        run: python -m unittest discover -s tests -t . -v
      - name: Prepare UI interaction tools
        run: npm install --prefix .tmp/ui-tools --no-save playwright@1.64.1
      - name: Check first-run and workspace UI
        run: node dev/ui_smoke.cjs
      - name: Upload UI verification screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ZhiLing-UI-verification
          path: ui-output/*
          if-no-files-found: ignore
          retention-days: 7
